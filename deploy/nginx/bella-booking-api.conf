upstream bella_user_service {
    server 127.0.0.1:3001;
}

upstream bella_hotel_service {
    server 127.0.0.1:3002;
}

upstream bella_booking_service {
    server 127.0.0.1:3003;
}

upstream bella_payment_service {
    server 127.0.0.1:3004;
}

upstream bella_notification_service {
    server 127.0.0.1:3005;
}

server {
    listen 80;
    server_name bella-booking-api.duckdns.org;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        return 200 "Bella Booking API is running\n";
        add_header Content-Type text/plain;
    }

    location = /health {
        proxy_pass http://bella_user_service;
    }

    location ~ ^/api/(auth|users)(/.*)?$ {
        rewrite ^/api/(auth|users)(/.*)?$ /$1$2 break;
        proxy_pass http://bella_user_service;
    }

    location ~ ^/api/hotels(/.*)?$ {
        rewrite ^/api/hotels(/.*)?$ /hotels$1 break;
        proxy_pass http://bella_hotel_service;
    }

    location ~ ^/api/(bookings|combos|pricing)(/.*)?$ {
        rewrite ^/api/(bookings|combos|pricing)(/.*)?$ /$1$2 break;
        proxy_pass http://bella_booking_service;
    }

    location ~ ^/api/payments(/.*)?$ {
        rewrite ^/api/payments(/.*)?$ /payments$1 break;
        proxy_pass http://bella_payment_service;
    }

    location ~ ^/api/notifications(/.*)?$ {
        rewrite ^/api/notifications(/.*)?$ /notifications$1 break;
        proxy_pass http://bella_notification_service;
    }

    location ~ ^/(auth|users)(/.*)?$ {
        proxy_pass http://bella_user_service;
    }

    location ~ ^/hotels(/.*)?$ {
        proxy_pass http://bella_hotel_service;
    }

    location ~ ^/(bookings|combos|pricing)(/.*)?$ {
        proxy_pass http://bella_booking_service;
    }

    location ~ ^/payments(/.*)?$ {
        proxy_pass http://bella_payment_service;
    }

    location ~ ^/notifications(/.*)?$ {
        proxy_pass http://bella_notification_service;
    }
}
