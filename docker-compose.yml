services:
  mongo:
    image: mongo:7.0
    container_name: hotel-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hotel-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - hotel-network

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hotel-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - hotel-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server localhost:9092",
        ]
      interval: 10s
      timeout: 10s
      retries: 5

  # User Service
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: hotel-user-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=${MONGODB_URI_DOCKER:-${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/bella_hotel}}}
      - MONGODB_URI=${MONGODB_URI_DOCKER:-${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/bella_hotel}}}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-12h}
      - CORS_ORIGINS=${CORS_ORIGINS:-${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}}
      - CORS_ORIGIN=${CORS_ORIGIN:-${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}}
      - TRUST_PROXY=${TRUST_PROXY:-1}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hotel-network
    volumes:
      - ./services/user-service:/app
      - /app/node_modules

  # Hotel Service
  hotel-service:
    build:
      context: ./services/hotel-service
      dockerfile: Dockerfile
    container_name: hotel-hotel-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGO_URI=${MONGODB_URI_DOCKER:-${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/bella_hotel}}}
      - MONGODB_URI=${MONGODB_URI_DOCKER:-${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/bella_hotel}}}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - CORS_ORIGINS=${CORS_ORIGINS:-${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}}
      - CORS_ORIGIN=${CORS_ORIGIN:-${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}}
      - TRUST_PROXY=${TRUST_PROXY:-1}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hotel-network
    volumes:
      - ./services/hotel-service:/app
      - ./data:/app/data:ro
      - /app/node_modules

  # Booking Service
  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile
    container_name: hotel-booking-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGO_URI=${MONGODB_URI_DOCKER:-${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/bella_hotel}}}
      - MONGODB_URI=${MONGODB_URI_DOCKER:-${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/bella_hotel}}}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - CORS_ORIGINS=${CORS_ORIGINS:-${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}}
      - CORS_ORIGIN=${CORS_ORIGIN:-${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - PAYMENT_HOLD_WINDOW_MINUTES=${PAYMENT_HOLD_WINDOW_MINUTES:-30}
      - MONGODB_TRANSACTIONS_ENABLED=${MONGODB_TRANSACTIONS_ENABLED:-false}
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hotel-network
    volumes:
      - ./services/booking-service:/app
      - /app/node_modules

  # Payment Service
  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: hotel-payment-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - MONGO_URI=${MONGODB_URI_DOCKER:-${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/bella_hotel}}}
      - MONGODB_URI=${MONGODB_URI_DOCKER:-${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/bella_hotel}}}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_BROKER=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - CORS_ORIGINS=${CORS_ORIGINS:-${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}}
      - CORS_ORIGIN=${CORS_ORIGIN:-${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}}
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-mock}
      - PAYMENT_PUBLIC_BASE_URL=${PAYMENT_PUBLIC_BASE_URL:-http://localhost:3004}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL:-http://localhost:5173}
      - PAYMENT_CHECKOUT_TTL_MINUTES=${PAYMENT_CHECKOUT_TTL_MINUTES:-30}
      - PAYMENT_WEBHOOK_TOLERANCE_SECONDS=${PAYMENT_WEBHOOK_TOLERANCE_SECONDS:-300}
      - MOCK_PAYMENT_WEBHOOK_SECRET=${MOCK_PAYMENT_WEBHOOK_SECRET:-bella-mock-webhook-secret}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_API_VERSION=${STRIPE_API_VERSION:-}
      - MONGODB_TRANSACTIONS_ENABLED=${MONGODB_TRANSACTIONS_ENABLED:-false}
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hotel-network
    volumes:
      - ./services/payment-service:/app
      - /app/node_modules

  # Notification Service
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: hotel-notification-service
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - MONGO_URI=${MONGODB_URI_DOCKER:-${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/bella_hotel}}}
      - MONGODB_URI=${MONGODB_URI_DOCKER:-${MONGODB_URI:-${MONGO_URI:-mongodb://mongo:27017/bella_hotel}}}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_BROKER=kafka:9092
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - CORS_ORIGINS=${CORS_ORIGINS:-${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}}
      - CORS_ORIGIN=${CORS_ORIGIN:-${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-your-email@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-your-app-password}
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - hotel-network
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules

networks:
  hotel-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
